name: Desk 2 - ₹2L Intraday MIS & Index F&O Trader (24/7 Cloud)

on:
  schedule:
    # Every 5 mins during NSE market hours (09:20 AM - 03:15 PM IST -> 03:50 - 09:45 UTC, Mon-Fri)
    - cron: '*/5 4-9 * * 1-5'
    # Mandatory 3:15 PM IST (09:45 UTC) EOD Forced Square-Off
    - cron: '45 9 * * 1-5'
  workflow_dispatch:

concurrency:
  group: nse-intraday-2l-lock
  cancel-in-progress: false

jobs:
  run-intraday-2l-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "${{ github.event.schedule }}" = "45 9 * * 1-5" ]; then
            python -c "import asyncio, os, json; from intraday_engine import run_unified_cycle; asyncio.run(run_unified_cycle(os.environ['GEMINI_API_KEY'], json.loads(os.environ['GCP_SERVICE_ACCOUNT_JSON']), force_square_off=True))"
          else
            python -c "import asyncio, os, json; from intraday_engine import run_fast_watchdog_loop; asyncio.run(run_fast_watchdog_loop(os.environ['GEMINI_API_KEY'], json.loads(os.environ['GCP_SERVICE_ACCOUNT_JSON']), duration_sec=260, poll_interval_sec=20))"
          fi
