name: NSE 5-Agent Auto Trader (24/7 Cloud)

on:
  schedule:
    # Runs every 15 minutes from 03:45 UTC to 10:00 UTC (09:15 AM to 03:30 PM IST), Monday to Friday
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:

jobs:
  run-nse-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          python -c "import asyncio, os, json; from engine import run_full_cycle; asyncio.run(run_full_cycle(os.environ['GEMINI_API_KEY'], json.loads(os.environ['GCP_SERVICE_ACCOUNT_JSON'])))"
