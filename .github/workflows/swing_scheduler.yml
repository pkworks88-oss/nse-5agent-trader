name: Desk 1 - ₹10L Positional Swing Auto Trader (24/7 Cloud)

on:
  schedule:
    # Intraday 15-min cycle + 30s split-speed watchdog (09:15 AM - 03:30 PM IST, Mon-Fri)
    - cron: '7,22,37,52 3-10 * * 1-5'
    # Daily 3:45 PM IST (10:15 UTC) EOD ATR Stop-Loss Recalibration + Peak Reset
    - cron: '15 10 * * 1-5'
  workflow_dispatch:

concurrency:
  group: nse-swing-10l-lock
  cancel-in-progress: false

jobs:
  run-swing-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "${{ github.event.schedule }}" = "15 10 * * 1-5" ]; then
            python -c "import os, json; from swing_engine import run_eod_sl_recalibration; run_eod_sl_recalibration(json.loads(os.environ['GCP_SERVICE_ACCOUNT_JSON']))"
          else
            python -c "import asyncio, os, json; from swing_engine import run_split_speed_session; asyncio.run(run_split_speed_session(os.environ['GEMINI_API_KEY'], json.loads(os.environ['GCP_SERVICE_ACCOUNT_JSON']), watchdog_ticks=27, interval_sec=30))"
          fi
