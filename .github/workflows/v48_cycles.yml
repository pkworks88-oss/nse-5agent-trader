name: NSE Multi-Asset V4.8 Scheduled Cycles & 20s Watchdog

on:
  workflow_dispatch:
    inputs:
      desk:
        description: "Desk to run (ALL, SWING, INTRADAY, FNO, COMMODITY)"
        required: true
        default: "ALL"
      mode:
        description: "Run mode (option_a, cycle, watchdog)"
        required: true
        default: "option_a"
      force_session:
        description: "Bypass market-hours / 14:00 IST entry cutoff (true/false)"
        required: true
        default: "false"
  schedule:
    - cron: "*/5 3-10 * * 1-5"
    - cron: "45 9 * * 1-5"

concurrency:
  group: nse-v48-trading-loop
  cancel-in-progress: false

jobs:
  run-v48-option-a:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LIVE_MODE: "false"
      CAS_ENABLED: "true"
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      UNIFIED_2L_SHEET_ID: ${{ secrets.UNIFIED_2L_SHEET_ID }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          python -c "
          import os, subprocess, sys
          from datetime import datetime, timezone

          rc = 0
          def run(args):
              global rc
              r = subprocess.run(['python', 'headless_runner.py'] + args)
              rc = rc or r.returncode   # one failing desk must not abort the others

          desk_input = os.environ.get('INPUT_DESK', 'ALL').strip().upper()
          mode_input = os.environ.get('INPUT_MODE', 'option_a').strip().lower()
          force_flag = ['--force-session'] if os.environ.get('INPUT_FORCE_SESSION', 'false').strip().lower() == 'true' else []

          if mode_input == 'watchdog':
              run(['--watchdog-only', '--watchdog-seconds', '20', '--iterations', '6'])
          elif mode_input == 'cycle' and desk_input not in ('', 'ALL'):
              run(['--desk', desk_input, '--max-entries', '1'] + force_flag)
          else:
              now = datetime.now(timezone.utc)
              desks = ('INTRADAY', 'FNO', 'COMMODITY') if desk_input in ('', 'ALL') else (desk_input,)
              for d in desks:
                  run(['--desk', d, '--max-entries', '1'] + force_flag)
              if desk_input in ('', 'ALL') and (now.minute % 15) <= 4:
                  run(['--desk', 'SWING', '--max-entries', '1'] + force_flag)
              run(['--watchdog-only', '--watchdog-seconds', '20', '--iterations', '6'])
          sys.exit(rc)
          "
        env:
          INPUT_DESK: ${{ github.event.inputs.desk }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_FORCE_SESSION: ${{ github.event.inputs.force_session }}
